name: Verify PriceMesh
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node scripts/check-routes.mjs
      - run: node --test scripts/connect-backend.test.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failure, path: frontend/test-results/}
